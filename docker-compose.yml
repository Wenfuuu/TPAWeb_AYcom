version: '3'

services:
  # Frontend
  frontend:
    build:
      context: ./tpa-frontend
    volumes:
      - ./tpa-frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    working_dir: /app
    command: npm run dev
    depends_on:
      - api-gateway

  # API Gateway
  api-gateway:
    build:
      context: ./tpa-backend/
      dockerfile: api-gateway/Dockerfile
    volumes:
      - ./tpa-backend/api-gateway:/app
    ports:
      - "8080:8080"
    depends_on:
      - service-auth
      - service-user

  # User Service
  service-user:
    build:
      context: ./tpa-backend/
      dockerfile: service-user/Dockerfile
    volumes:
      - ./tpa-backend/service-user:/app
    ports:
      - "50051:50051"
    depends_on:
      - service-auth
      - service-thread
      - redis
      - db-user

  # Auth Service
  service-auth:
    build:
      context: ./tpa-backend/
      dockerfile: service-auth/Dockerfile
    volumes:
      - ./tpa-backend/service-auth:/app
    ports:
      - "50052:50052"
    depends_on:
      - service-email
      - rabbitmq

  # Email Service
  service-email:
    build:
      context: ./tpa-backend/
      dockerfile: service-email/Dockerfile
    volumes:
      - ./tpa-backend/service-email:/app
    ports:
      - "50053:50053"
    depends_on:
      rabbitmq:
        condition: service_healthy

  # Thread Service
  service-thread:
    build:
      context: ./tpa-backend/
      dockerfile: service-thread/Dockerfile
    volumes:
      - ./tpa-backend/service-thread:/app
    ports:
      - "50054:50054"
    depends_on:
      - redis
      - db-user

  # Chat Service -> grpc 50055, websocket 50056
  service-chat:
    build:
      context: ./tpa-backend/
      dockerfile: service-chat/Dockerfile
    volumes:
      - ./tpa-backend/service-chat:/app
    ports:
      - "50055:50055"
      - "50056:50056"
    depends_on:
      - db-chat

  # Notification Service

  # AI

  # User Database
  db-user:
    image: postgres:latest
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: root
      POSTGRES_DB: user-service-db
    ports:
      - "5432:5432"
    volumes:
      - user-data:/var/lib/postgresql/data
      - ./database/db-user/init:/docker-entrypoint-initdb.d

  # Chat Database
  db-chat:
    image: postgres:latest
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: root
      POSTGRES_DB: chat-service-db
    ports:
      - "5433:5432"
    volumes:
      - chat-data:/var/lib/postgresql/data
      - ./database/db-chat/init:/docker-entrypoint-initdb.d

  # Message Broker
  rabbitmq:
    image: rabbitmq:4
    ports:
      - "5672:5672"   # AMQP port
      # - "15672:15672" # Management UI
    environment:
      - RABBITMQ_DEFAULT_USER=guest
      - RABBITMQ_DEFAULT_PASS=guest
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmqctl", "status"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis
  redis:
    image: redis:latest
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

volumes:
  user-data:
  chat-data:
  rabbitmq-data:
  redis-data: