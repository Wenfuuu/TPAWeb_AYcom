version: '3'

services:
  # Frontend
  frontend:
    build:
      context: ./tpa-frontend
    volumes:
      - ./tpa-frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    working_dir: /app
    command: npm run dev
    depends_on:
      - api-gateway

  # API Gateway
  api-gateway:
    build:
      context: ./tpa-backend/
      dockerfile: api-gateway/Dockerfile
    volumes:
      - ./tpa-backend/api-gateway:/app
    ports:
      - "8080:8080"
    depends_on:
      - service-auth
      - service-user

  # User Service
  service-user:
    build:
      context: ./tpa-backend/
      dockerfile: service-user/Dockerfile
    volumes:
      - ./tpa-backend/service-user:/app
    ports:
      - "50051:50051"
    depends_on:
      - service-auth
      - db-user

  # Auth Service
  service-auth:
    build:
      context: ./tpa-backend/
      dockerfile: service-auth/Dockerfile
    volumes:
      - ./tpa-backend/service-auth:/app
    ports:
      - "50052:50052"

  # User Database
  db-user:
    image: postgres:latest
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: root
      POSTGRES_DB: user-service-db
    ports:
      - "5432:5432"
    volumes:
      - user-data:/var/lib/postgresql/data
      - ./database/db-user/init:/docker-entrypoint-initdb.d

volumes:
  user-data: