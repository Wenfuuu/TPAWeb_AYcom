[build]
# Build configurations
poll = true
poll_interval = 1000
cmd = "go build -o ./tmp/main ./main.go"
bin = "./tmp/main"
full_bin = "./tmp/main"
include_ext = ["go", "tpl", "tmpl", "html"]
exclude_dir = ["tmp", "vendor", "node_modules"]
include_dir = []
exclude_file = []
delay = 1000
stop_on_error = true
log = "build-errors.log"

[color]
main = "magenta"
watcher = "cyan"
build = "yellow"
runner = "green"

[log]
time = false

[misc]
clean_on_exit = true

[screen]
clear_on_rebuild = true