basePath: /
definitions:
  handler.AcceptReportRequest:
    properties:
      action:
        example: ban_user
        type: string
      report_id:
        example: 123e4567-e89b-12d3-a456-426614174000
        type: string
    required:
    - action
    - report_id
    type: object
  handler.ErrorResponse:
    properties:
      error:
        example: Invalid request
        type: string
    type: object
  handler.FollowUserRequest:
    properties:
      follower_id:
        example: 123e4567-e89b-12d3-a456-426614174000
        type: string
      following_id:
        example: 123e4567-e89b-12d3-a456-426614174001
        type: string
    required:
    - follower_id
    - following_id
    type: object
  handler.LoginRequest:
    properties:
      email:
        example: john@example.com
        type: string
      password:
        example: password123
        type: string
    required:
    - email
    - password
    type: object
  handler.MessageResponse:
    properties:
      message:
        example: Operation successful
        type: string
    type: object
  handler.PremiumRequestID:
    properties:
      request_id:
        example: 123e4567-e89b-12d3-a456-426614174000
        type: string
    required:
    - request_id
    type: object
  handler.RegisterPremiumRequest:
    properties:
      facePicture:
        example: https://example.com/face.jpg
        type: string
      identityNumber:
        example: "1234567890123456"
        type: string
      reason:
        example: I want to support the platform
        type: string
      userId:
        example: 123e4567-e89b-12d3-a456-426614174000
        type: string
    required:
    - facePicture
    - identityNumber
    - reason
    - userId
    type: object
  handler.RegisterRequest:
    properties:
      banner:
        example: https://example.com/banner.jpg
        type: string
      dateOfBirth:
        example: "1990-01-01"
        type: string
      email:
        example: john@example.com
        type: string
      gender:
        example: male
        type: string
      isSubscribed:
        example: true
        type: boolean
      name:
        example: John Doe
        type: string
      password:
        example: password123
        type: string
      profilePicture:
        example: https://example.com/profile.jpg
        type: string
      securityAnswer:
        example: Fluffy
        type: string
      securityQuestion:
        example: What was the name of your first pet?
        type: string
      username:
        example: johndoe
        type: string
    required:
    - banner
    - dateOfBirth
    - email
    - gender
    - name
    - password
    - profilePicture
    - securityAnswer
    - securityQuestion
    - username
    type: object
  handler.RejectReportRequest:
    properties:
      reason:
        example: Insufficient evidence
        type: string
      report_id:
        example: 123e4567-e89b-12d3-a456-426614174000
        type: string
    required:
    - reason
    - report_id
    type: object
  handler.ResetPasswordRequest:
    properties:
      password:
        example: newPassword123
        type: string
      user_id:
        example: 123e4567-e89b-12d3-a456-426614174000
        type: string
    required:
    - password
    - user_id
    type: object
  handler.SendVerificationCodeRequest:
    properties:
      email:
        example: john@example.com
        type: string
    required:
    - email
    type: object
  handler.SetUserBanStatusRequest:
    properties:
      banned:
        example: true
        type: boolean
      user_id:
        example: 123e4567-e89b-12d3-a456-426614174000
        type: string
    required:
    - banned
    - user_id
    type: object
  handler.VerifyCodeRequest:
    properties:
      code:
        example: "12345"
        type: string
      email:
        example: john@example.com
        type: string
    required:
    - code
    - email
    type: object
host: localhost:8080
info:
  contact:
    email: support@swagger.io
    name: API Support
    url: http://www.swagger.io/support
  description: This is the API Gateway for the TPA Web microservices project.
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  termsOfService: http://swagger.io/terms/
  title: TPA Web API Gateway
  version: "1.0"
paths:
  /auth/get-auth-user:
    get:
      description: Get current authenticated user information
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get authenticated user
      tags:
      - Authentication
  /auth/login:
    post:
      consumes:
      - application/json
      description: Authenticate user and return access tokens
      parameters:
      - description: Login credentials
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handler.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      summary: User login
      tags:
      - Authentication
  /auth/refresh:
    get:
      description: Get new access and refresh tokens using refresh token
      parameters:
      - description: Refresh Token
        in: header
        name: Refresh-token
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      summary: Refresh access token
      tags:
      - Authentication
  /auth/register:
    post:
      consumes:
      - application/json
      description: Register a new user account
      parameters:
      - description: User registration data
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handler.RegisterRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.MessageResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      summary: Register a new user
      tags:
      - Authentication
  /auth/send-code:
    post:
      consumes:
      - application/json
      description: Send verification code to user's email for registration
      parameters:
      - description: Email for verification
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handler.SendVerificationCodeRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: boolean
            type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      summary: Send verification code
      tags:
      - Authentication
  /auth/verify-code:
    post:
      consumes:
      - application/json
      description: Verify the verification code sent to user's email
      parameters:
      - description: Email and verification code
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handler.VerifyCodeRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: boolean
            type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      summary: Verify verification code
      tags:
      - Authentication
  /users/accept-premium:
    post:
      consumes:
      - application/json
      description: Accept a user's premium account request (admin function)
      parameters:
      - description: Premium Request ID
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handler.PremiumRequestID'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.MessageResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      summary: Accept premium account request
      tags:
      - Users
  /users/accept-report:
    post:
      consumes:
      - application/json
      description: Accept a user report and take action (admin function)
      parameters:
      - description: Accept Report Request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handler.AcceptReportRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.MessageResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      summary: Accept a user report
      tags:
      - Users
  /users/ban:
    put:
      consumes:
      - application/json
      description: Update the ban status of a user (admin function)
      parameters:
      - description: Ban Status Request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handler.SetUserBanStatusRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.MessageResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      summary: Set user ban status
      tags:
      - Users
  /users/follow:
    post:
      consumes:
      - application/json
      description: Create a follow relationship between two users
      parameters:
      - description: Follow User Request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handler.FollowUserRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.MessageResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      summary: Follow a user
      tags:
      - Users
  /users/follower:
    get:
      description: Retrieve a list of users who follow the specified user
      parameters:
      - description: User ID
        in: query
        name: user_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              type: object
            type: array
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      summary: Get user's followers
      tags:
      - Users
  /users/following:
    get:
      description: Retrieve a list of users who are followed by the specified user
      parameters:
      - description: User ID
        in: query
        name: user_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              type: object
            type: array
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      summary: Get users followed by a user
      tags:
      - Users
  /users/premium-request:
    get:
      description: Retrieve all pending premium account requests (admin function)
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              type: object
            type: array
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      summary: Get all premium account requests
      tags:
      - Users
  /users/register-premium:
    post:
      consumes:
      - application/json
      description: Register a user for premium account status
      parameters:
      - description: Premium Registration Request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handler.RegisterPremiumRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Register for premium account
      tags:
      - Users
  /users/reject-premium:
    post:
      consumes:
      - application/json
      description: Reject a user's premium account request (admin function)
      parameters:
      - description: Premium Request ID
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handler.PremiumRequestID'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.MessageResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      summary: Reject premium account request
      tags:
      - Users
  /users/reject-report:
    post:
      consumes:
      - application/json
      description: Reject a user report (admin function)
      parameters:
      - description: Reject Report Request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handler.RejectReportRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.MessageResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      summary: Reject a user report
      tags:
      - Users
  /users/reports:
    get:
      description: Retrieve all user reports (admin function)
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              type: object
            type: array
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      summary: Get all user reports
      tags:
      - Users
  /users/reset-password:
    put:
      consumes:
      - application/json
      description: Reset a user's password using security question
      parameters:
      - description: Reset Password Request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handler.ResetPasswordRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.MessageResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      summary: Reset user password
      tags:
      - Users
  /users/security-question:
    get:
      description: Retrieve the security question for a user by user ID
      parameters:
      - description: User ID
        in: query
        name: user_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      summary: Get user's security question
      tags:
      - Users
  /users/unfollow:
    delete:
      description: Remove a follow relationship between two users
      parameters:
      - description: Follower ID
        in: query
        name: follower_id
        required: true
        type: string
      - description: Following ID
        in: query
        name: following_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.MessageResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      summary: Unfollow a user
      tags:
      - Users
  /users/upload-video/{type}:
    post:
      consumes:
      - multipart/form-data
      description: Upload a video file and get the URL back
      parameters:
      - description: Upload type
        in: path
        name: type
        required: true
        type: string
      - description: Video file to upload
        in: formData
        name: file
        required: true
        type: file
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      summary: Upload a video file
      tags:
      - Users
  /users/upload/{type}:
    post:
      consumes:
      - multipart/form-data
      description: Upload an image file and get the URL back
      parameters:
      - description: Upload type
        in: path
        name: type
        required: true
        type: string
      - description: Image file to upload
        in: formData
        name: file
        required: true
        type: file
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      summary: Upload an image file
      tags:
      - Users
  /users/user:
    get:
      description: Retrieve a list of all registered users
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              type: object
            type: array
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      summary: Get all users
      tags:
      - Users
  /users/user-email:
    get:
      description: Retrieve a user by their email address
      parameters:
      - description: User Email
        in: query
        name: email
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      summary: Get user by email
      tags:
      - Users
  /users/user-profile:
    get:
      description: Retrieve a specific user by their ID
      parameters:
      - description: User ID
        in: query
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            type: object
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      summary: Get user by ID
      tags:
      - Users
  /users/who-to-follow:
    get:
      description: Retrieve a list of users recommended to follow for the specified
        user
      parameters:
      - description: User ID
        in: query
        name: user_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              type: object
            type: array
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      summary: Get users to follow recommendations
      tags:
      - Users
schemes:
- http
securityDefinitions:
  BearerAuth:
    description: Type "Bearer" followed by a space and JWT token.
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
