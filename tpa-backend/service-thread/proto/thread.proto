syntax = "proto3";

package thread;

option go_package = "github.com/Wenfuuu/tpa-web/pkg/proto/thread";

service ThreadService {
    rpc GetThreadById(GetThreadByIdRequest) returns (GetThreadResponse);
    rpc GetAllThreads(GetAllThreadsRequest) returns (GetAllThreadsResponse);
    rpc GetFollowingThreads(GetFollowingThreadsRequest) returns (GetAllThreadsResponse);
    rpc GetLikedThreads(GetLikedThreadsRequest) returns (GetAllThreadsResponse);
    rpc GetBookmarkThreads(GetBookmarkThreadsRequest) returns (GetAllThreadsResponse);
    rpc PostThread(PostThreadRequest) returns (ThreadResponse);
    rpc GetAllThreadCategories(GetAllThreadCategoriesRequest) returns (GetAllThreadCategoriesResponse);
    rpc GetAllCommunity(GetAllCommunitiesRequest) returns (GetAllCommunitiesResponse);
    rpc GetAllThreadFile(GetAllThreadFileRequest) returns (GetAllThreadFileResponse);
    rpc LikeThread(LikeThreadRequest) returns (ActionResponse);
    rpc UnlikeThread(UnlikeThreadRequest) returns (ActionResponse);
    rpc BookmarkThread(BookmarkThreadRequest) returns (ActionResponse);
    rpc UnbookmarkThread(UnbookmarkThreadRequest) returns (ActionResponse);
}

message LikeThreadRequest {
    string user_id = 1;
    string thread_id = 2;
}

message UnlikeThreadRequest {
    string user_id = 1;
    string thread_id = 2;
}

message BookmarkThreadRequest {
    string user_id = 1;
    string thread_id = 2;
}

message UnbookmarkThreadRequest {
    string user_id = 1;
    string thread_id = 2;
}

message ActionResponse {
    string message = 1;
}

message GetThreadByIdRequest {
    string thread_id = 1;
}

message GetThreadResponse {
    Thread thread = 1;
}

message GetAllThreadsRequest {
    int32 page = 1;
}

message GetAllThreadsResponse {
    repeated Thread threads = 1;
}

message GetFollowingThreadsRequest {
    int32 page = 1;
    string user_id = 2;
}

message GetLikedThreadsRequest {
    string user_id = 1;
}

message GetBookmarkThreadsRequest {
    string user_id = 1;
}

message GetAllThreadCategoriesRequest {}

message GetAllThreadCategoriesResponse {
    repeated ThreadCategory thread_categories = 1;
}

message GetAllCommunitiesRequest {}

message GetAllCommunitiesResponse {
    repeated Community communities = 1;
}

message GetAllThreadFileRequest {}

message GetAllThreadFileResponse {
    repeated ThreadFile thread_files = 1;
}

message PostThreadRequest {
    string user_id = 1;
    string category_id = 2;
    string community_id = 3;
    string content = 4;
    string reply_permission = 5;
    bool is_advertisement = 6;
    string scheduled_at = 7;
    repeated string image_urls = 8;
}

message Thread {
    string id = 1;
    string user_id = 2;
    string category_id = 3;
    string community_id = 4;
    string reply_to_id = 5;
    string repost_of_id = 6;
    string content = 7;
    string reply_permission = 8;
    bool is_advertisement = 9;
    string status = 10;
    string scheduled_at = 11;
    string created_at = 12;
}

message ThreadCategory {
    string id = 1;
    string name = 2;
}

message Community {
    string id = 1;
    string name = 2;
    string description = 3;
}

message ThreadFile {
    string id = 1;
    string thread_id = 2;
    string file = 3;
}

message ThreadResponse {
    Thread thread = 1;
}