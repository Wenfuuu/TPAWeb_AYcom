syntax = "proto3";

package thread;

option go_package = "github.com/Wenfuuu/tpa-web/pkg/proto/thread";

service ThreadService {
    rpc GetReplies(GetRepliesRequest) returns (GetAllThreadsResponse);
    rpc GetThreadById(GetThreadByIdRequest) returns (GetThreadResponse);
    rpc GetAllThreads(GetAllThreadsRequest) returns (GetAllThreadsResponse);
    rpc GetFollowingThreads(GetFollowingThreadsRequest) returns (GetAllThreadsResponse);
    rpc GetBookmark(GetBookmarkRequest) returns (GetAllThreadsResponse);
    rpc GetRepostThreads(GetRepostThreadsRequest) returns (GetAllThreadsResponse);
    rpc GetLikedThreads(GetLikedThreadsRequest) returns (GetAllThreadsResponse);
    rpc GetBookmarkThreads(GetBookmarkThreadsRequest) returns (GetAllThreadsResponse);
    rpc PostThread(PostThreadRequest) returns (ThreadResponse);
    rpc ReplyThread(ReplyThreadRequest) returns (ThreadResponse);
    rpc RepostThread(RepostThreadRequest) returns (ThreadResponse);
    rpc UnrepostThread(UnrepostThreadRequest) returns (ActionResponse);
    rpc GetAllThreadCategories(GetAllThreadCategoriesRequest) returns (GetAllThreadCategoriesResponse);
    rpc GetAllCommunity(GetAllCommunitiesRequest) returns (GetAllCommunitiesResponse);
    rpc GetAllCommunityCategories(GetAllCommunityCategoriesRequest) returns (GetAllCommunityCategoriesResponse);
    rpc GetAllThreadFile(GetAllThreadFileRequest) returns (GetAllThreadFileResponse);
    rpc LikeThread(LikeThreadRequest) returns (ActionResponse);
    rpc UnlikeThread(UnlikeThreadRequest) returns (ActionResponse);
    rpc BookmarkThread(BookmarkThreadRequest) returns (ActionResponse);
    rpc UnbookmarkThread(UnbookmarkThreadRequest) returns (ActionResponse);
    rpc GetTopHashtags(GetTopHashtagsRequest) returns (HashtagCountResponse);
    rpc GetCommunityPagination(GetCommunityPaginationRequest) returns (GetAllCommunitiesResponse);
    rpc RequestJoinCommunity(RequestJoinCommunityRequest) returns (ActionResponse);
    rpc GetPendingCommunity(GetPendingCommunityRequest) returns (GetAllCommunitiesResponse);
    rpc JoinCommunity(JoinCommunityRequest) returns (ActionResponse);
    rpc GetJoinedCommunity(GetJoinedCommunityRequest) returns (GetAllCommunitiesResponse);
}

message JoinCommunityRequest {
    string user_id = 1;
    string community_id = 2;
}

message RequestJoinCommunityRequest {
    string user_id = 1;
    string community_id = 2;
}

message GetTopHashtagsRequest {}

message HashtagCountResponse {
    repeated HashtagCount hashtagCount = 1;
}

message HashtagCount {
    string id = 1;
    string name = 2;
    int32 count = 3;
}

message ReplyThreadRequest {
    string user_id = 1;
    string reply_to_id = 2;
    string content = 3;
    string reply_permission = 4;
    bool is_advertisement = 5;
    string scheduled_at = 6;
    repeated string image_urls = 7;
}

message RepostThreadRequest {
    string user_id = 1;
    string thread_id = 2;
}

message UnrepostThreadRequest {
    string user_id = 1;
    string thread_id = 2;
}

message LikeThreadRequest {
    string user_id = 1;
    string thread_id = 2;
}

message UnlikeThreadRequest {
    string user_id = 1;
    string thread_id = 2;
}

message BookmarkThreadRequest {
    string user_id = 1;
    string thread_id = 2;
}

message UnbookmarkThreadRequest {
    string user_id = 1;
    string thread_id = 2;
}

message ActionResponse {
    string message = 1;
}

message GetRepliesRequest {
    int32 page = 1;
    string thread_id = 2;
}

message GetThreadByIdRequest {
    string thread_id = 1;
}

message GetThreadResponse {
    Thread thread = 1;
}

message GetAllThreadsRequest {
    int32 page = 1;
}

message GetAllThreadsResponse {
    repeated Thread threads = 1;
}

message GetFollowingThreadsRequest {
    int32 page = 1;
    string user_id = 2;
}

message GetBookmarkRequest {
    int32 page = 1;
    string user_id = 2;
    string search = 3;
}

message GetRepostThreadsRequest {
    string user_id = 1;
}

message GetLikedThreadsRequest {
    string user_id = 1;
}

message GetBookmarkThreadsRequest {
    string user_id = 1;
}

message GetAllThreadCategoriesRequest {}

message GetAllThreadCategoriesResponse {
    repeated ThreadCategory thread_categories = 1;
}

message GetAllCommunityCategoriesRequest {}

message GetAllCommunityCategoriesResponse {
    repeated CommunityCategory community_categories = 1;
}

message GetAllCommunitiesRequest {}

message GetAllCommunitiesResponse {
    repeated Community communities = 1;
}

message GetCommunityPaginationRequest {
    int32 page = 1;
    int32 limit = 2;
    string search = 3;
}

message GetPendingCommunityRequest {
    string user_id = 1;
    int32 page = 2;
    int32 limit = 3;
    string search = 4;
}

message GetJoinedCommunityRequest {
    string user_id = 1;
    int32 page = 2;
    int32 limit = 3;
    string search = 4;
}

message GetAllThreadFileRequest {}

message GetAllThreadFileResponse {
    repeated ThreadFile thread_files = 1;
}

message PostThreadRequest {
    string user_id = 1;
    string category_id = 2;
    string community_id = 3;
    string content = 4;
    string reply_permission = 5;
    bool is_advertisement = 6;
    string scheduled_at = 7;
    repeated string image_urls = 8;
}

message Thread {
    string id = 1;
    string user_id = 2;
    string category_id = 3;
    string community_id = 4;
    string reply_to_id = 5;
    string repost_of_id = 6;
    string content = 7;
    string reply_permission = 8;
    bool is_advertisement = 9;
    string status = 10;
    string scheduled_at = 11;
    string created_at = 12;
}

message ThreadCategory {
    string id = 1;
    string name = 2;
}

message Community {
    string id = 1;
    string name = 2;
    string description = 3;
    string logo = 4;
    string category_id = 5;
    string banner = 6;
    string rule = 7;
}

message CommunityCategory {
    string id = 1;
    string name = 2;
}

message ThreadFile {
    string id = 1;
    string thread_id = 2;
    string file = 3;
}

message ThreadResponse {
    Thread thread = 1;
}