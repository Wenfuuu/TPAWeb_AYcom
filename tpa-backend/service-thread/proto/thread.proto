syntax = "proto3";

package thread;

option go_package = "github.com/Wenfuuu/tpa-web/pkg/proto/thread";

service ThreadService {
    rpc GetAllThreads(GetAllThreadsRequest) returns (GetAllThreadsResponse);
    rpc PostThread(PostThreadRequest) returns (ThreadResponse);
    rpc GetAllThreadCategories(GetAllThreadCategoriesRequest) returns (GetAllThreadCategoriesResponse);
    rpc GetAllCommunity(GetAllCommunitiesRequest) returns (GetAllCommunitiesResponse);
    rpc GetAllThreadFile(GetAllThreadFileRequest) returns (GetAllThreadFileResponse);
}

message GetAllThreadsRequest {
    int32 page = 1;
}

message GetAllThreadsResponse {
    repeated Thread threads = 1;
}

message GetAllThreadCategoriesRequest {}

message GetAllThreadCategoriesResponse {
    repeated ThreadCategory thread_categories = 1;
}

message GetAllCommunitiesRequest {}

message GetAllCommunitiesResponse {
    repeated Community communities = 1;
}

message GetAllThreadFileRequest {}

message GetAllThreadFileResponse {
    repeated ThreadFile thread_files = 1;
}

message PostThreadRequest {
    string user_id = 1;
    string category_id = 2;
    string community_id = 3;
    string content = 4;
    string reply_permission = 5;
    bool is_advertisement = 6;
    string scheduled_at = 7;
    repeated string image_urls = 8;
}

message Thread {
    string id = 1;
    string user_id = 2;
    string category_id = 3;
    string community_id = 4;
    string content = 5;
    string reply_permission = 6;
    bool is_advertisement = 7;
    string status = 8;
    string scheduled_at = 9;
    string created_at = 10;
}

message ThreadCategory {
    string id = 1;
    string name = 2;
}

message Community {
    string id = 1;
    string name = 2;
    string description = 3;
}

message ThreadFile {
    string id = 1;
    string thread_id = 2;
    string file = 3;
}

message ThreadResponse {
    Thread thread = 1;
}