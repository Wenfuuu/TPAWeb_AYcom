syntax = "proto3";

package user;

option go_package = "github.com/Wenfuuu/tpa-web/pkg/proto/user";

service UserService {
  rpc GetUserByEmail(GetUserByEmailRequest) returns (UserResponse);
  rpc Register(RegisterRequest) returns (UserResponse);
  rpc GetUser(GetUserRequest) returns (UserResponse);
  rpc UpdateUser(UpdateUserRequest) returns (UserResponse);
  rpc DeleteUser(DeleteUserRequest) returns (DeleteUserResponse);
  rpc GetAllUsers(GetAllUsersRequest) returns (GetAllUsersResponse);
}

message GetUserByEmailRequest {
  string email = 1;
}

message RegisterRequest {
  string name = 1;
  string username = 2;
  string email = 3;
  string password = 4;
  string gender = 5;
  string profile_picture = 6;
  string banner = 7;
  string date_of_birth = 8;
  bool is_active = 9;
  bool is_banned = 10;
  string role = 11;
  bool is_subscribed = 12;
  bool is_premium = 13;
  string bio = 14;
  string created_at = 15;
}

message LoginResponse {
  string token = 1;
  User user = 2;
}

message GetUserRequest {
  string id = 1;
}

message UpdateUserRequest {
  string id = 1;
  string name = 2;
  string username = 3;
  string email = 4;
  string password = 5;
  string gender = 6;
  string profile_picture = 7;
  string banner = 8;
  string date_of_birth = 9;
  bool is_active = 10;
  bool is_banned = 11;
  string role = 12;
  bool is_subscribed = 13;
  bool is_premium = 14;
  string bio = 15;
  string created_at = 16;
}

message DeleteUserRequest {
  string id = 1;
}

message DeleteUserResponse {
  bool success = 1;
}

message GetAllUsersRequest {} // empty request

message GetAllUsersResponse {
  repeated User users = 1; // a list of users
}

message User {
  string id = 1;
  string name = 2;
  string username = 3;
  string email = 4;
  string password = 5;
  string gender = 6;
  string profile_picture = 7;
  string banner = 8;
  string date_of_birth = 9;
  bool is_active = 10;
  bool is_banned = 11;
  string role = 12;
  bool is_subscribed = 13;
  bool is_premium = 14;
  string bio = 15;
  string created_at = 16;
}

message UserResponse {
  User user = 1;
}