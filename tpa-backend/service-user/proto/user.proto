syntax = "proto3";

package user;

option go_package = "github.com/Wenfuuu/tpa-web/pkg/proto/user";

service UserService {
  rpc GetUserByEmail(GetUserByEmailRequest) returns (UserResponse);
  rpc Register(RegisterRequest) returns (UserResponse);
  rpc GetUser(GetUserRequest) returns (UserResponse);
  rpc UpdateUser(UpdateUserRequest) returns (UserResponse);
  rpc DeleteUser(DeleteUserRequest) returns (DeleteUserResponse);
  rpc GetAllUsers(GetAllUsersRequest) returns (GetAllUsersResponse);
  rpc GetWhoToFollow(GetWhoToFollowRequest) returns (GetAllUsersResponse);
  rpc UploadImage(UploadImageRequest) returns (UploadImageResponse);
  rpc GetFollower(GetFollowerRequest) returns (FollowResponse);
  rpc GetFollowing(GetFollowingRequest) returns (FollowResponse);
  rpc RegisterPremium(RegisterPremiumRequest) returns (RegisterPremiumResponse);
  rpc UploadVideo(UploadVideoRequest) returns (UploadVideoResponse);

  rpc FollowUser(FollowUserRequest) returns (Follow);
  rpc UnfollowUser(UnfollowUserRequest) returns (UnfollowUserResponse);

  rpc GetSecurityQuestion(GetSecurityQuestionRequest) returns (SecurityQuestionResponse);
  rpc ResetPassword(ResetPasswordRequest) returns (ResetPasswordResponse);

  rpc SetUserBanStatus(SetUserBanStatusRequest) returns (SetUserBanStatusResponse);

  rpc GetPremiumRequests(GetPremiumRequestsRequest) returns (GetPremiumRequestsResponse);
  rpc AcceptPremiumRequest(PremiumRequestId) returns (ActionResponse);
  rpc RejectPremiumRequest(PremiumRequestId) returns (ActionResponse);

  rpc GetReports(GetReportsRequest) returns (GetReportsResponse);
  rpc AcceptReport(AcceptReportRequest) returns (ActionResponse);
  rpc RejectReport(RejectReportRequest) returns (ActionResponse);
}

message RejectReportRequest {
  string report_id = 1;
}

message AcceptReportRequest {
  string report_id = 1;
}

message GetReportsRequest {}

message GetReportsResponse {
  repeated Report reports = 1;
}

message Report {
  string id = 1;
  string user_id = 2;
  string reported_id = 3;
  string reason = 4;
  string created_at = 5;
}

message PremiumRequestId {
  string request_id = 1;
}

message GetPremiumRequestsRequest {}

message GetPremiumRequestsResponse {
  repeated PremiumRequest premium_requests = 1;
}

message PremiumRequest {
  string id = 1;
  string user_id = 2;
  string identity_number = 3;
  string reason = 4;
  string face_picture = 5;
  string created_at = 6;
}

message ActionResponse {
  string message = 1;
}

message SetUserBanStatusRequest {
  string user_id = 1;
  bool banned = 2;
}

message SetUserBanStatusResponse {
  string message = 1;
}

message ResetPasswordRequest {
  string user_id = 1;
  string password = 2; // new password
}

message ResetPasswordResponse {
  string message = 1;
}

message GetSecurityQuestionRequest {
  string user_id = 1;
}

message SecurityQuestionResponse {
  string user_id = 1;
  string security_question = 2;
  string security_answer = 3;
}

message UnfollowUserRequest {
  string following_id = 1;
  string follower_id = 2;
}

message UnfollowUserResponse {
  string message = 1;
}

message FollowUserRequest {
  string following_id = 1;
  string follower_id = 2;
}

message RegisterPremiumRequest {
  string user_id = 1;
  string identity_number = 2;
  string reason = 3;
  string face_picture = 4;
}

message RegisterPremiumResponse {
  string message = 1;
}

message GetWhoToFollowRequest {
  string user_id = 1;
}

message GetFollowerRequest {
  string user_id = 1;
}

message GetFollowingRequest {
  string user_id = 1;
}

message FollowResponse {
  repeated Follow follows = 1;
}

message Follow {
  string follower_id = 1;
  string following_id = 2;
}

message GetUserByEmailRequest {
  string email = 1;
}

message RegisterRequest {
  string name = 1;
  string username = 2;
  string email = 3;
  string password = 4;
  string gender = 5;
  string profile_picture = 6;
  string banner = 7;
  string date_of_birth = 8;
  bool is_active = 9;
  bool is_banned = 10;
  string role = 11;
  bool is_subscribed = 12;
  string security_question = 13;
  string security_answer = 14;
  bool is_premium = 15;
  string bio = 16;
  string created_at = 17;
}

message LoginResponse {
  string token = 1;
  User user = 2;
}

message GetUserRequest {
  string id = 1;
}

message UpdateUserRequest {
  string id = 1;
  string name = 2;
  string username = 3;
  string email = 4;
  string password = 5;
  string gender = 6;
  string profile_picture = 7;
  string banner = 8;
  string date_of_birth = 9;
  bool is_active = 10;
  bool is_banned = 11;
  string role = 12;
  bool is_subscribed = 13;
  bool is_premium = 14;
  string bio = 15;
  string created_at = 16;
}

message DeleteUserRequest {
  string id = 1;
}

message DeleteUserResponse {
  bool success = 1;
}

message GetAllUsersRequest {} // empty request

message GetAllUsersResponse {
  repeated User users = 1; // a list of users
}

message UploadImageRequest {
  bytes image_data = 1;
  string filename = 2;
}

message UploadImageResponse {
  string image_url = 2;
}

message UploadVideoRequest {
  bytes video_data = 1;
  string filename = 2;
}

message UploadVideoResponse {
  string video_url = 1;
}

message User {
  string id = 1;
  string name = 2;
  string username = 3;
  string email = 4;
  string password = 5;
  string gender = 6;
  string profile_picture = 7;
  string banner = 8;
  string date_of_birth = 9;
  bool is_active = 10;
  bool is_banned = 11;
  string role = 12;
  bool is_subscribed = 13;
  bool is_premium = 14;
  string bio = 15;
  string created_at = 16;
}

message UserResponse {
  User user = 1;
}